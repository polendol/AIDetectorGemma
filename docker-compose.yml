name: ai-signature-checker

services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "7860:7860"
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL_NAME: gemma3:4b-it-qat
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data: